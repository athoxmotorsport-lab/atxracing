name: Refresh public race pages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/sync-public-events.py
      - run: python3 build.py
      - run: python3 scripts/verify_site.py
      - name: Publish refreshed pages
        run: |
          git config user.name 'ATX Racing site'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/public-events.json dist assets fr en index.html sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public race pages and sitemap'
            git push origin HEAD:main
          fi
      - name: Deploy GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: refresh
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
